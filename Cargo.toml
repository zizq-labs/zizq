[package]
name = "zizq"
version = "0.7.3"
edition = "2024"
license = "BUSL-1.1"

[lib]
name = "zizq"
path = "src/lib.rs"
doctest = false

[dependencies]
fjall = "3.1.4"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scru128 = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmp-serde = "1.3.1"
tokio-stream = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
croner = "4"
crossbeam-skiplist = "0.1"
dashmap = "6"
humantime = "2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
ratatui = "0.30"
crossterm = "0.29"
tui-input = "0.15"
libc = "0.2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls-no-provider"] }
reqwest-websocket = "0.6"
rolling-file = "0.2"
bytesize = "2"
tracing-appender = "0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
socket2 = { version = "0.6", features = ["all"] }
rcgen = { version = "0.14.8", features = ["x509-parser"] }
time = "0.3"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }
urlencoding = "2.1.3"
tar = "0.4"
flate2 = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# mimalloc replaces the default allocator where it measurably helps:
#
# - musl, which the Linux release binaries are built against. Its own
#   allocator is much slower under multi-threaded, allocation-heavy load.
# - macOS, where the system allocator holds on to freed memory, so a large
#   backlog drains with memory still climbing. Throughput is the same.
#
# Windows keeps its system allocator.
[target.'cfg(any(target_env = "musl", target_os = "macos"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rmp = "0.8.15"
criterion = { version = "0.8", features = ["async_tokio"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
ed25519-dalek = { version = "3", features = ["rand_core", "pkcs8", "pem"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
insta = { version = "1", features = ["filters"] }
rcgen = "0.14.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
