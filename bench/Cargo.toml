[package]
name = "zizq-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace root, so it builds independently of the server
# package in the directory above.
[workspace]

[dependencies]
# Pinned exactly: a client upgrade must never change server
# comparisons between runs.
zizq = "=0.7.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.38"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "net", "signal"] }

[profile.release]
debug = false
