name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # --- Build & Test ---

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-

      - name: cargo test --no-run
        run: cargo test --no-run

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test

  # --- Release binary for integration tests (linux only) ---

  release-binary:
    name: Release Binary
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo registry + release build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-release-

      - name: Build release binary
        run: ./release.sh --target x86_64-unknown-linux-musl

      - name: Read version
        id: version
        run: echo "version=$(cargo pkgid | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-binary-v${{ steps.version.outputs.version }}
          path: target/release/zizq-*-linux-x86_64.tar.gz
          overwrite: true

  # --- Integration tests against client repos ---

  discover-node:
    name: Discover Node Versions
    needs: release-binary
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover compatible client versions
        id: discover
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          matrix=$(./.github/scripts/discover-client-versions.sh \
            node "${{ needs.release-binary.outputs.version }}")
          echo "Discovered matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration-node:
    name: Integration (Node, ${{ matrix.label }})
    needs: [release-binary, discover-node]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-node.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zizq-binary-v${{ needs.release-binary.outputs.version }}
          path: server
      - name: Unpack server binary
        run: tar -xzf server/zizq-${{ needs.release-binary.outputs.version }}-linux-x86_64.tar.gz -C server

      - name: Checkout Node client @ ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          repository: zizq-labs/zizq-node
          ref: ${{ matrix.ref }}
          path: client
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Prepare artifact directory
        run: mkdir -p artifact

      - name: Download release tarball (tagged version)
        if: matrix.tarball != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh release download "${{ matrix.ref }}" \
            --repo zizq-labs/zizq-node \
            --pattern "${{ matrix.tarball }}" \
            --dir artifact

      - name: Build client from source (main)
        if: matrix.tarball == ''
        working-directory: client
        run: |
          ./release.sh
          cp target/release/zizq-*.tgz ../artifact/

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(
            --binary ${{ github.workspace }}/server/zizq
            --tarball ${{ github.workspace }}/artifact/zizq-*.tgz
          )
          # Harnesses predating 0.3.x reject unknown arguments rather
          # than ignoring them, and predate this flag entirely. Probe
          # the checkout for the parser arm rather than keeping a
          # version table here — same idiom as the `zizq-derive`
          # check in the Rust job.
          if grep -q -- '--license-key)' integration/run.sh; then
            if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
              ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
            fi
          else
            echo "note: this client's harness predates --license-key;" \
                 "licensed tests will skip"
          fi
          ./integration/run.sh "${ARGS[@]}"

  discover-ruby:
    name: Discover Ruby Versions
    needs: release-binary
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover compatible client versions
        id: discover
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          matrix=$(./.github/scripts/discover-client-versions.sh \
            ruby "${{ needs.release-binary.outputs.version }}")
          echo "Discovered matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration-ruby:
    name: Integration (Ruby, ${{ matrix.label }})
    needs: [release-binary, discover-ruby]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-ruby.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zizq-binary-v${{ needs.release-binary.outputs.version }}
          path: server
      - name: Unpack server binary
        run: tar -xzf server/zizq-${{ needs.release-binary.outputs.version }}-linux-x86_64.tar.gz -C server

      - name: Checkout Ruby client @ ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          repository: zizq-labs/zizq-ruby
          ref: ${{ matrix.ref }}
          path: client
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: client

      - name: Prepare artifact directory
        run: mkdir -p artifact

      - name: Download release gem (tagged version)
        if: matrix.tarball != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh release download "${{ matrix.ref }}" \
            --repo zizq-labs/zizq-ruby \
            --pattern "${{ matrix.tarball }}" \
            --dir artifact

      - name: Build client from source (main)
        if: matrix.tarball == ''
        working-directory: client
        run: |
          ./release.sh
          cp target/release/zizq-*.gem ../artifact/

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          ARGS=(
            --binary ${{ github.workspace }}/server/zizq
            --gem ${{ github.workspace }}/artifact/zizq-*.gem
          )
          # Harnesses predating 0.3.x reject unknown arguments rather
          # than ignoring them, and predate this flag entirely. Probe
          # the checkout for the parser arm rather than keeping a
          # version table here — same idiom as the `zizq-derive`
          # check in the Rust job.
          if grep -q -- '--license-key)' integration/run.sh; then
            if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
              ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
            fi
          else
            echo "note: this client's harness predates --license-key;" \
                 "licensed tests will skip"
          fi
          ./integration/run.sh "${ARGS[@]}"

  discover-rust:
    name: Discover Rust Versions
    needs: release-binary
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover compatible client versions
        id: discover
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          matrix=$(./.github/scripts/discover-client-versions.sh \
            rust "${{ needs.release-binary.outputs.version }}")
          echo "Discovered matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration-rust:
    name: Integration (Rust, ${{ matrix.label }})
    needs: [release-binary, discover-rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-rust.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zizq-binary-v${{ needs.release-binary.outputs.version }}
          path: server
      - name: Unpack server binary
        run: tar -xzf server/zizq-${{ needs.release-binary.outputs.version }}-linux-x86_64.tar.gz -C server

      - name: Checkout Rust client @ ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          repository: zizq-labs/zizq-rust
          ref: ${{ matrix.ref }}
          path: client
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rust-integration-${{ hashFiles('client/Cargo.toml', 'client/Cargo.lock', 'client/integration/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-integration-

      - name: Prepare artifact directory
        run: mkdir -p artifact

      - name: Download release crate (tagged version)
        if: matrix.tarball != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh release download "${{ matrix.ref }}" \
            --repo zizq-labs/zizq-rust \
            --pattern "${{ matrix.tarball }}" \
            --dir artifact
          # Modern (>= 0.6.0) clients ship a companion `zizq-derive`
          # crate alongside `zizq`. The checkout at `client/` tells us
          # which era we're in — pull the sibling artifact only when
          # the directory exists.
          if [ -d client/zizq-derive ]; then
            gh release download "${{ matrix.ref }}" \
              --repo zizq-labs/zizq-rust \
              --pattern "zizq-derive-*.crate" \
              --dir artifact
          fi

      - name: Build client from source (main)
        if: matrix.tarball == ''
        working-directory: client
        run: |
          ./release.sh
          # `zizq-*.crate` would also match `zizq-derive-*.crate` in
          # modern clients — anchor the second glob element to a digit
          # so only the main crate matches.
          cp target/release/zizq-[0-9]*.crate ../artifact/
          if [ -d zizq-derive ]; then
            cp target/release/zizq-derive-*.crate ../artifact/
          fi

      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          # Digit-anchored glob so the main-crate arg doesn't
          # accidentally expand to include the derive sibling.
          ZIZQ_CRATE=(${{ github.workspace }}/artifact/zizq-[0-9]*.crate)
          ARGS=(
            --binary ${{ github.workspace }}/server/zizq
            --crate "${ZIZQ_CRATE[0]}"
          )
          # Pre-0.6.0 clients don't have the sibling crate and don't
          # accept `--macro-crate`. The `zizq-derive/` directory in
          # the checkout is the marker for "modern client, please
          # pass the extra flag".
          if [ -d zizq-derive ]; then
            DERIVE_CRATE=(${{ github.workspace }}/artifact/zizq-derive-*.crate)
            ARGS+=(--macro-crate "${DERIVE_CRATE[0]}")
          fi
          # Harnesses predating 0.3.x reject unknown arguments rather
          # than ignoring them, and predate this flag entirely. Probe
          # the checkout for the parser arm rather than keeping a
          # version table here — same idiom as the `zizq-derive`
          # check in the Rust job.
          if grep -q -- '--license-key)' integration/run.sh; then
            if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
              ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
            fi
          else
            echo "note: this client's harness predates --license-key;" \
                 "licensed tests will skip"
          fi
          ./integration/run.sh "${ARGS[@]}"

  discover-elixir:
    name: Discover Elixir Versions
    needs: release-binary
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover compatible client versions
        id: discover
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          matrix=$(./.github/scripts/discover-client-versions.sh \
            elixir "${{ needs.release-binary.outputs.version }}")
          echo "Discovered matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  integration-elixir:
    name: Integration (Elixir, ${{ matrix.label }})
    needs: [release-binary, discover-elixir]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-elixir.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zizq-binary-v${{ needs.release-binary.outputs.version }}
          path: server
      - name: Unpack server binary
        run: tar -xzf server/zizq-${{ needs.release-binary.outputs.version }}-linux-x86_64.tar.gz -C server

      - name: Checkout Elixir client @ ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          repository: zizq-labs/zizq-elixir
          ref: ${{ matrix.ref }}
          path: client
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      # Pinned to the client's declared floor (`elixir: "~> 1.18"` in
      # its mix.exs), so every tag this matrix can select compiles by
      # construction. Bump when the client raises its floor — a
      # floating toolchain would let an unrelated Elixir or OTP
      # release muddy the signal this job exists to give.
      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Prepare artifact directory
        run: mkdir -p artifact

      - name: Download release tarball (tagged version)
        if: matrix.tarball != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh release download "${{ matrix.ref }}" \
            --repo zizq-labs/zizq-elixir \
            --pattern "${{ matrix.tarball }}" \
            --dir artifact

      - name: Build client from source (main)
        if: matrix.tarball == ''
        working-directory: client
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          ./release.sh
          cp _build/release/zizq-*.tar ../artifact/

      # The harness is a separate Mix project built against the
      # packaged tarball, so it tests what would be published rather
      # than the checkout.
      - name: Run integration tests
        working-directory: client
        env:
          ZIZQ_LICENSE_KEY: ${{ secrets.ZIZQ_LICENSE_KEY }}
        run: |
          mix local.hex --force
          mix local.rebar --force
          ARGS=(
            --binary ${{ github.workspace }}/server/zizq
            --tarball ${{ github.workspace }}/artifact/zizq-*.tar
          )
          # Harnesses predating 0.3.x reject unknown arguments rather
          # than ignoring them, and predate this flag entirely. Probe
          # the checkout for the parser arm rather than keeping a
          # version table here — same idiom as the `zizq-derive`
          # check in the Rust job.
          if grep -q -- '--license-key)' integration/run.sh; then
            if [[ -n "$ZIZQ_LICENSE_KEY" ]]; then
              ARGS+=(--license-key "$ZIZQ_LICENSE_KEY")
            fi
          else
            echo "note: this client's harness predates --license-key;" \
                 "licensed tests will skip"
          fi
          ./integration/run.sh "${ARGS[@]}"

  # --- Integration gate (stable check name for branch protection) ---

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [integration-node, integration-ruby, integration-rust, integration-elixir]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.integration-node.result }}" != "success" ] || \
             [ "${{ needs.integration-ruby.result }}" != "success" ] || \
             [ "${{ needs.integration-rust.result }}" != "success" ] || \
             [ "${{ needs.integration-elixir.result }}" != "success" ]; then
            echo "Integration tests failed or were skipped."
            echo "  Node: ${{ needs.integration-node.result }}"
            echo "  Ruby: ${{ needs.integration-ruby.result }}"
            echo "  Rust: ${{ needs.integration-rust.result }}"
            echo "  Elixir: ${{ needs.integration-elixir.result }}"
            exit 1
          fi
          echo "All integration tests passed."

  # --- Multi-platform release build (only runs on approval) ---

  release-all-platforms:
    name: Release (${{ matrix.platform }})
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            platform: linux-x86_64
            deps: sudo apt-get install -y musl-tools
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            deps: sudo apt-get install -y musl-tools
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
            platform: windows-x86_64
            deps: sudo apt-get install -y gcc-mingw-w64-x86-64
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: macos-arm64
            deps: ""
          - target: x86_64-apple-darwin
            runner: macos-14
            platform: macos-x86_64
            deps: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + release build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.platform }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.platform }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', '.github/workflows/ci.yml') }}-
            ${{ runner.os }}-cargo-release-${{ matrix.platform }}-

      - name: Install build dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      - name: Set up macOS code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$CERT_PATH"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          # Prepend our keychain to the user search list so codesign can
          # find the identity. The ephemeral runner's existing list is
          # preserved for any subsequent tooling that needs login items.
          existing=$(security list-keychains -d user | sed -e 's/"//g' -e 's/^[[:space:]]*//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $existing

          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build release binary
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          # Clear any stale packaged artifacts a restored `target/`
          # cache may carry forward from an earlier version's build —
          # otherwise the upload globs would sweep them into the release.
          rm -f target/release/zizq-*
          ./release.sh --target ${{ matrix.target }}

      - name: Clean up macOS keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: zizq-release-${{ matrix.platform }}
          path: target/release/zizq-*

  # --- Publish GitHub Release (runs after all platforms built) ---

  publish:
    name: Publish Release
    needs: release-all-platforms
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cargo pkgid | sed 's/.*[#@]//')" >> "$GITHUB_OUTPUT"

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zizq-release-*
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version=${{ steps.version.outputs.version }}
          # Extract the section for this version (between ## headers).
          sed -n "/^## ${version}/,/^## /p" CHANGELOG.md | head -n -1 | tail -n +2 > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file release-notes.md \
            artifacts/zizq-${version}-*
